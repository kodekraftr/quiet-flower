<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" href="data:," />
    <title>Hand Tracking Test · The Song of Quiet Flower</title>
    <style>
      :root { --bg: #0b1016; --text: #e8eef5; --muted: #a9b6c6; --gold: #f7d27a; --card: rgba(17, 24, 33, 0.88); --border: #3a4452; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: system-ui, 'Segoe UI', sans-serif; }
      #scene-container { position: fixed; inset: 0; }
      #overlay {
        position: fixed; inset: 0; z-index: 10; overflow-y: auto; box-sizing: border-box;
        padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; pointer-events: none;
      }
      #overlay > * { pointer-events: auto; width: min(760px, 100%); box-sizing: border-box; }
      header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
      h1 { margin: 0; font: 600 28px 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; }
      a { color: var(--muted); font-size: 14px; }
      .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
      #vr-button {
        min-height: 48px; padding: 0 26px; border: none; border-radius: 999px; cursor: pointer;
        background: var(--gold); color: #14100a; font: 700 16px system-ui, sans-serif;
      }
      #vr-button:disabled { cursor: default; background: var(--border); color: var(--muted); }
      #vr-button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
      #vr-status { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; flex: 1 1 240px; }
      .hands { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      pre {
        margin: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--card);
        font: 14px/1.6 ui-monospace, Consolas, monospace; white-space: pre-wrap; min-height: 6.4em;
      }
      #hand-apart { min-height: 0; text-align: center; }
      .note { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      body[data-xr='on'] .bar { display: none; }
      @media (max-width: 600px) { .hands { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body data-xr="off">
    <div id="scene-container"></div>
    <div id="overlay">
      <header>
        <h1>Hand tracking test</h1>
        <a href="./">Back to the game</a>
      </header>
      <div class="bar">
        <button id="vr-button" type="button" disabled>Enter VR</button>
        <p id="vr-status">Loading…</p>
      </div>
      <div class="hands">
        <pre id="hand-left">LEFT HAND
not tracked</pre>
        <pre id="hand-right">RIGHT HAND
not tracked</pre>
      </div>
      <pre id="hand-apart">Hands apart: –</pre>
      <p class="note">
        0 is the midpoint between your palms, so moving one hand moves both readouts. Left/right and forward/back follow
        the way you're facing. The same readout floats in front of you in VR.
      </p>
    </div>
    <script type="module" src="/src/test-page.ts"></script>
  </body>
</html>
