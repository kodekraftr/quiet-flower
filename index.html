        color: #a9b6c6; font-size: 13px; line-height: 1.5;
      }
      kbd { background: #1e2834; border-radius: 4px; padding: 1px 6px; font-size: 12px; color: #e8eef5; }

    <button id="vr-button" type="button">Enter VR</button>
